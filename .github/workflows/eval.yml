name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest

      - name: Ingest
        run: python -m pria.cli ingest

      # Fails the build if nDCG@10, lexical/code MRR, citation resolvability,
      # citation support or the adversarial pass rate drops below its gate.
      - name: Eval gate
        run: python -m pria.cli eval

      - name: Ablation
        run: python -m pria.cli ablate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports-py${{ matrix.python-version }}
          path: |
            reports/
            artifacts/spans.jsonl
