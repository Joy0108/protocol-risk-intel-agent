[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pria"
version = "0.1.0"
description = "Protocol Risk and Exploit Intelligence Agent: retrieval and agentic diagnosis over smart contract audit evidence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "langgraph>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
# Production retrieval backends. Nothing in the default install pulls torch.
models = ["sentence-transformers>=3.0", "torch>=2.2"]
# Real PDF page extraction instead of the pre-extracted page corpus.
pdf = ["pdfplumber>=0.11"]
# Declaration-accurate Solidity parsing instead of the brace-matching fallback.
solidity = ["tree-sitter>=0.22", "tree-sitter-solidity>=1.2"]
# Vector database and span tracing.
serving = ["qdrant-client>=1.9", "arize-phoenix>=4.0", "opentelemetry-sdk>=1.25"]
llm = ["anthropic>=0.40"]

[project.scripts]
pria = "pria.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 128
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
